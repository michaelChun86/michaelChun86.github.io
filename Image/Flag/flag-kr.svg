<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" role="img" aria-label="대한민국">
  <!-- 태극기 — 대한민국 국기법 시행령의 표준 도형 비율.
       · 깃면 가로:세로 = 3:2  (여기선 30 × 20)
       · 태극 지름 = 세로의 1/2 = 10  (반지름 5), 깃면 정중앙
       · 4괘는 깃면의 두 대각선 위에 놓이고, 효(막대)는 그 대각선과 직각을 이룬다.
         대각선 기울기가 atan(2/3)=33.69도 이므로 효의 각도는 90-33.69 = 56.31도.
       · 효 길이 = 태극 지름의 1/2 = 5, 효 두께 = 지름의 1/12, 효 사이 간격 = 지름의 1/24
       · 괘 중심은 깃면 중심에서 10만큼(= 태극 지름만큼) 대각선을 따라 떨어진 곳 -->
  <rect width="30" height="20" fill="#ffffff"/>

  <!-- 태극: 빨강(양)이 위, 파랑(음)이 아래.
       태극의 축은 건괘(좌상)와 곤괘(우하)를 잇는 대각선과 나란하다(수평에서 33.69도).
       그래서 빨강의 둥근 머리는 양의 괘인 건괘 쪽(좌상)을,
       파랑의 머리는 음의 괘인 곤괘 쪽(우하)을 정확히 향한다.
       ※ 효(막대)는 이 대각선과 직각(56.31도)이고, 태극 축은 나란하다(33.69도).
          이 둘을 헷갈리면 태극만 돌아간 것처럼 보인다. -->
  <g transform="translate(15,10) rotate(33.69)">
    <circle r="5" fill="#0047a0"/>
    <!-- 위쪽 반원에서 오른쪽 작은 반원을 덜어내고 왼쪽 작은 반원을 더해 S자 경계를 만든다 -->
    <path fill="#cd2e3a" d="M-5,0 A5,5 0 0 1 5,0 A2.5,2.5 0 0 0 0,0 A2.5,2.5 0 0 1 -5,0 Z"/>
  </g>

  <!-- 4괘: 좌상 건(乾, 하늘) / 우상 감(坎, 물) / 좌하 리(離, 불) / 우하 곤(坤, 땅).
       네 괘 모두 위아래가 대칭이라 효를 그리는 순서는 상관없다. -->
  <g fill="#000000">
    <!-- 좌상단 건(☰) — 이어진 효 3개 -->
    <g transform="translate(6.6795,4.4530) rotate(-56.31)">
      <rect x="-2.5" y="-1.66667" width="5" height="0.83333"/>
      <rect x="-2.5" y="-0.41667" width="5" height="0.83333"/>
      <rect x="-2.5" y="0.83333" width="5" height="0.83333"/>
    </g>

    <!-- 우상단 감(☵) — 끊김 / 이어짐 / 끊김 -->
    <g transform="translate(23.3205,4.4530) rotate(56.31)">
      <rect x="-2.5" y="-1.66667" width="2.08333" height="0.83333"/>
      <rect x="0.41667" y="-1.66667" width="2.08333" height="0.83333"/>
      <rect x="-2.5" y="-0.41667" width="5" height="0.83333"/>
      <rect x="-2.5" y="0.83333" width="2.08333" height="0.83333"/>
      <rect x="0.41667" y="0.83333" width="2.08333" height="0.83333"/>
    </g>

    <!-- 좌하단 리(☲) — 이어짐 / 끊김 / 이어짐 -->
    <g transform="translate(6.6795,15.5470) rotate(56.31)">
      <rect x="-2.5" y="-1.66667" width="5" height="0.83333"/>
      <rect x="-2.5" y="-0.41667" width="2.08333" height="0.83333"/>
      <rect x="0.41667" y="-0.41667" width="2.08333" height="0.83333"/>
      <rect x="-2.5" y="0.83333" width="5" height="0.83333"/>
    </g>

    <!-- 우하단 곤(☷) — 끊긴 효 3개 -->
    <g transform="translate(23.3205,15.5470) rotate(-56.31)">
      <rect x="-2.5" y="-1.66667" width="2.08333" height="0.83333"/>
      <rect x="0.41667" y="-1.66667" width="2.08333" height="0.83333"/>
      <rect x="-2.5" y="-0.41667" width="2.08333" height="0.83333"/>
      <rect x="0.41667" y="-0.41667" width="2.08333" height="0.83333"/>
      <rect x="-2.5" y="0.83333" width="2.08333" height="0.83333"/>
      <rect x="0.41667" y="0.83333" width="2.08333" height="0.83333"/>
    </g>
  </g>
</svg>
